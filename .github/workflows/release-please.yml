# On push to main, run tests and then release a new version with release-please
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

  release-please:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # A PAT (not the default GITHUB_TOKEN) is required here: releases/tags
      # created with GITHUB_TOKEN do not trigger other workflows (e.g. the
      # release-published.yml deploy workflow), due to GitHub's recursive
      # workflow-run prevention. See DEPLOYMENT.md for how to create it.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
