# On github release published, build and push a new Docker image to GHCR and then update the application on Coolify
name: Deploy to Coolify

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          echo "value=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:latest

  deploy-coolify:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Update application image tag on Coolify
        run: |
          curl --fail-with-body \
            --request PATCH \
            --url "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"docker_registry_image_tag\": \"${VERSION}\"}"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          VERSION: ${{ needs.build-and-push.outputs.version }}

      - name: Restart (redeploy) application on Coolify
        run: |
          curl --fail-with-body \
            --request POST \
            --url "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/restart" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
