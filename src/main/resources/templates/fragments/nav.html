<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="nav"
        class="sticky top-0 z-50 border-b border-[#293a52] bg-[#0a121e]/[.96] shadow-[0_8px_30px_rgba(0,0,0,.2)]">
    <a class="fixed left-2 top-2 z-[100] -translate-y-[150%] bg-white px-4 py-3 text-[#0b1321] focus:translate-y-0"
       href="#main-content">Skip to content</a>
    <nav class="mx-auto flex min-h-16 max-w-screen-2xl items-center justify-between gap-4 px-4 md:min-h-[72px] lg:gap-10 lg:px-8"
         aria-label="Main navigation">
        <a href="/"
           class="inline-flex items-center gap-3 whitespace-nowrap text-xl font-extrabold tracking-tight text-slate-50"
           aria-label="Pubgity home">
            <span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-blue-400 via-blue-600 to-indigo-700 text-xl text-white shadow-[0_4px_16px_rgba(37,99,235,.35)]"
                  aria-hidden="true">P</span>
            <span>pubgity<span class="text-blue-400">.</span></span>
        </a>

        <div class="hidden flex-1 items-center gap-1 md:flex">
            <a href="/" class="rounded-lg px-4 py-3 font-semibold text-slate-300 hover:bg-[#223149] hover:text-white">Home</a>
            <a href="/players"
               class="rounded-lg px-4 py-3 font-semibold text-slate-300 hover:bg-[#223149] hover:text-white">Players</a>
            <a th:if="${isAdmin or isModerator}" href="/jobs"
               class="rounded-lg px-4 py-3 font-semibold text-slate-300 hover:bg-[#223149] hover:text-white">Import</a>
            <a th:if="${isAdmin}" href="/admin/users"
               class="rounded-lg px-4 py-3 font-semibold text-slate-300 hover:bg-[#223149] hover:text-white">Admin</a>
        </div>
        <div class="hidden items-center gap-1 md:flex">
            <a th:if="${isAuthenticated}" href="/profile"
               class="max-w-28 truncate rounded-lg px-4 py-3 font-semibold text-slate-300 hover:bg-[#223149] hover:text-white lg:max-w-48"
               th:text="${username}">Profile</a>
            <form th:if="${isAuthenticated}" method="post" th:action="@{/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit"
                        class="inline-flex min-h-[44px] items-center justify-center rounded-xl border border-[#3c587a] bg-[#1b304c] px-4 py-2.5 font-semibold text-blue-50 hover:bg-[#274364]">
                    Sign out
                </button>
            </form>
            <a th:unless="${isAuthenticated}" href="/oauth2/authorization/oidc"
               class="inline-flex min-h-[44px] items-center justify-center rounded-xl border border-[#3c587a] bg-[#1b304c] px-4 py-2.5 font-semibold text-blue-50 hover:bg-[#274364]">Sign
                in</a>
        </div>

        <details class="md:hidden">
            <summary aria-label="Toggle navigation"
                     class="flex min-h-[44px] cursor-pointer list-none items-center gap-2 rounded-xl border border-[#3c587a] px-4 font-semibold text-blue-50 [&::-webkit-details-marker]:hidden">
                <span aria-hidden="true">☰</span> Menu
            </summary>
            <div class="absolute inset-x-0 top-full grid gap-1 border-b border-[#2a3b53] bg-[#101c2d] px-4 pb-4 pt-3 shadow-[0_16px_24px_rgba(0,0,0,.3)]">
                <a href="/"
                   class="flex min-h-[44px] items-center rounded-lg px-3 py-2 font-semibold text-slate-200 hover:bg-[#223149]">Home</a>
                <a href="/players"
                   class="flex min-h-[44px] items-center rounded-lg px-3 py-2 font-semibold text-slate-200 hover:bg-[#223149]">Players</a>
                <a th:if="${isAdmin or isModerator}" href="/jobs"
                   class="flex min-h-[44px] items-center rounded-lg px-3 py-2 font-semibold text-slate-200 hover:bg-[#223149]">Import</a>
                <a th:if="${isAdmin}" href="/admin/users"
                   class="flex min-h-[44px] items-center rounded-lg px-3 py-2 font-semibold text-slate-200 hover:bg-[#223149]">Admin</a>
                <a th:if="${isAuthenticated}" href="/profile"
                   class="flex min-h-[44px] items-center gap-2 rounded-lg px-3 py-2 font-semibold text-slate-200 hover:bg-[#223149]">My
                    profile <span class="break-all font-normal text-slate-400" th:text="${username}"></span></a>
                <form th:if="${isAuthenticated}" method="post" th:action="@{/logout}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="flex min-h-[44px] w-full items-center rounded-lg px-3 py-2 text-left font-semibold text-slate-200 hover:bg-[#223149]">
                        Sign out
                    </button>
                </form>
                <a th:unless="${isAuthenticated}" href="/oauth2/authorization/oidc"
                   class="flex min-h-[44px] items-center rounded-lg px-3 py-2 font-semibold text-slate-200 hover:bg-[#223149]">Sign
                    in</a>
            </div>
        </details>
    </nav>
</header>
</body>
</html>
