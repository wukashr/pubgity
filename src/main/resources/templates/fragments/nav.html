<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="nav" class="site-header">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="/" class="site-brand" aria-label="Pubgity home">
            <span class="site-brand-mark" aria-hidden="true">P</span>
            <span>pubgity<span class="site-brand-dot">.</span></span>
        </a>

        <div class="desktop-nav">
            <a href="/">Home</a>
            <a href="/players">Players</a>
            <a th:if="${isAdmin or isModerator}" href="/jobs">Import</a>
            <a th:if="${isAdmin}" href="/admin/users">Admin</a>
        </div>
        <div class="desktop-auth">
            <a th:if="${isAuthenticated}" href="/profile" class="nav-profile" th:text="${username}">Profile</a>
            <form th:if="${isAuthenticated}" method="post" th:action="@{/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="nav-action">Sign out</button>
            </form>
            <a th:unless="${isAuthenticated}" href="/oauth2/authorization/oidc" class="nav-action">Sign in</a>
        </div>

        <details class="mobile-nav">
            <summary aria-label="Toggle navigation"><span aria-hidden="true">☰</span> Menu</summary>
            <div class="mobile-nav-panel">
                <a href="/">Home</a>
                <a href="/players">Players</a>
                <a th:if="${isAdmin or isModerator}" href="/jobs">Import</a>
                <a th:if="${isAdmin}" href="/admin/users">Admin</a>
                <a th:if="${isAuthenticated}" href="/profile">My profile <span th:text="${username}"></span></a>
                <form th:if="${isAuthenticated}" method="post" th:action="@{/logout}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit">Sign out</button>
                </form>
                <a th:unless="${isAuthenticated}" href="/oauth2/authorization/oidc">Sign in</a>
            </div>
        </details>
    </nav>
</header>
</body>
</html>
