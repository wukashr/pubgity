<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pubgity - User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#080e19] bg-[radial-gradient(ellipse_at_50%_-20%,#193657_0%,#0b1321_45%,#080e19_100%)] bg-fixed font-sans text-gray-100 [color-scheme:dark] [&_*:focus-visible]:!outline [&_*:focus-visible]:!outline-2 [&_*:focus-visible]:!outline-offset-[3px] [&_*:focus-visible]:!outline-blue-300">

<div th:replace="~{fragments/nav :: nav}"></div>

<main id="main-content"
      class="max-w-screen-xl mx-auto px-4 pt-6 pb-12 md:pt-10 md:pb-16 space-y-6 [overflow-wrap:anywhere] [&_h1]:tracking-tight [&_h2]:tracking-tight">
    <div class="rounded-2xl border border-[#2a3b53] bg-[linear-gradient(115deg,rgba(37,99,235,.18),rgba(21,31,48,.9)_60%)] p-5 md:p-6 flex flex-wrap items-end justify-between gap-3">
        <div><p class="mb-2 text-xs font-bold uppercase tracking-[.12em] text-blue-300">Administration</p>
            <h1 class="text-3xl font-bold text-white">User Management</h1></div>
        <p class="text-sm text-[#9aabc0]">
            Roles are managed in your identity provider and synced here on every login.
        </p>
    </div>

    <!-- User search -->
    <div class="relative max-w-sm">
        <input id="userSearch" type="text" placeholder="Filter users by name or email…"
               aria-label="Filter users by name or email"
               class="min-w-0 min-h-[44px] md:min-h-0 w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-lg px-4 py-2 text-base md:text-sm focus:outline-none focus:border-blue-500 placeholder-[#9aabc0]">
        <button type="button" aria-label="Clear user filter"
                class="min-h-[44px] md:min-h-0 absolute right-2 top-1/2 -translate-y-1/2 text-[#9aabc0] hover:text-gray-300 text-lg leading-none hidden"
                id="userSearchClear">✕
        </button>
    </div>

    <div id="noUsersMsg" th:if="${#lists.isEmpty(users)}" class="text-[#9aabc0]">No users registered yet.</div>
    <p id="noMatchMsg" class="text-[#9aabc0] hidden">No users match your filter.</p>

    <!-- User cards -->
    <div th:each="user : ${users}"
         class="bg-[#151f30] border-[#2a3b53] rounded-[.85rem] shadow-[0_12px_30px_rgba(0,0,0,.12)] [&>div.border-b]:border-[#2a3b53] border p-5 space-y-5 user-card"
         th:data-username="${user.username}"
         th:data-email="${user.email}">

        <!-- User header -->
        <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-semibold text-white text-lg" th:text="${user.username}">username</span>
                    <!-- Role badges — read-only, synced from OIDC provider -->
                    <span th:each="r : ${user.roles}"
                          class="px-2 py-0.5 rounded-full text-sm md:text-xs font-semibold"
                          th:classappend="${r.name() == 'ADMIN'    ? 'bg-violet-700 text-white' :
                                           (r.name() == 'MODERATOR' ? 'bg-blue-700 text-white' :
                                                                       'bg-gray-700 text-gray-300')}"
                          th:text="${r}">ROLE</span>
                    <span class="text-sm md:text-xs text-[#869ab2] italic">(synced from identity provider)</span>
                </div>
                <div class="text-[#9aabc0] text-sm mt-0.5" th:text="${user.email}"></div>
                <div class="text-[#869ab2] text-sm md:text-xs font-mono mt-0.5" th:text="${'sub: ' + user.sub}"></div>
            </div>
        </div>

        <!-- Moderator constraints (shown when the user holds the MODERATOR role) -->
        <div th:if="${user.roles.contains(T(org.traanite.pubgity.user.AppRole).MODERATOR)}"
             class="border-t border-gray-700 pt-4">
            <h3 class="text-sm md:text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Moderator
                Constraints</h3>
            <form method="post" th:action="@{/admin/users/{id}/moderator-constraints(id=${user.id})}"
                  class="space-y-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="flex items-center gap-3">
                    <label class="text-sm text-gray-400 w-32" th:for="${'max-queue-' + user.id}">Max queue size</label>
                    <input type="number" name="maxQueueSize" th:id="${'max-queue-' + user.id}" min="1" max="50"
                           th:value="${user.moderatorConstraints?.maxQueueSize ?: 5}"
                           class="min-w-0 min-h-[44px] md:min-h-0 w-20 bg-gray-700 border border-gray-600 text-gray-200 text-base md:text-sm rounded px-2 py-1 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="text-sm text-gray-400 block mb-2">Allowed players</label>

                    <!-- Player filter controls -->
                    <div class="flex flex-wrap items-center gap-3 mb-2" th:unless="${#lists.isEmpty(players)}">
                        <input type="text" placeholder="Filter players…" aria-label="Filter allowed players"
                               data-player-filter
                               class="min-w-0 min-h-[44px] md:min-h-0 bg-gray-700 border border-gray-600 text-gray-200 text-base md:text-xs rounded px-3 py-1.5 focus:outline-none focus:border-blue-500 placeholder-[#9aabc0] w-48">
                        <label class="flex items-center gap-1.5 text-sm md:text-xs text-gray-400 cursor-pointer select-none">
                            <input type="checkbox" data-only-checked
                                   class="accent-blue-500">
                            Show only checked
                        </label>
                    </div>

                    <div data-player-list
                         class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 max-h-48 overflow-y-auto bg-gray-900/50 border border-gray-700 rounded p-3">
                        <label th:each="player : ${players}"
                               data-player-item
                               th:data-player-name="${player.playerName}"
                               class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer hover:text-white">
                            <input type="checkbox" name="allowedPlayerIds"
                                   th:value="${player.id}"
                                   th:checked="${user.moderatorConstraints?.allowedPlayerIds?.contains(player.id) ?: false}"
                                   class="accent-blue-500">
                            <span th:text="${player.playerName}">Player</span>
                        </label>
                        <p data-no-match-players class="text-[#869ab2] text-sm md:text-xs col-span-full hidden">No
                            players match.</p>
                    </div>
                    <p th:if="${#lists.isEmpty(players)}" class="text-[#869ab2] text-sm md:text-xs mt-1">No tracked
                        players yet.</p>
                </div>

                <button type="submit"
                        class="min-h-[44px] md:min-h-0 px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white text-sm rounded transition-colors">
                    Save Constraints
                </button>
            </form>
        </div>

    </div>
</main>

<script th:src="@{/js/admin-users.js}" src="/js/admin-users.js"></script>
</body>
</html>
